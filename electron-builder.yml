appId: 'kr.dreamcraft.alicegameland.launcher'
productName: '앨리스의 게임랜드'
artifactName: 'alice-gameland-launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2026 JooHwan Kim. Helios Launcher © Daniel Scalzi.'

asar: true
compression: 'maximum'

publish:
  provider: github
  owner: AliceGameLand
  repo: AliceGameLand-Launcher

files:
  - '!{dist,runtime,.runtime-cache,.gitignore,.vscode,docs,.impeccable,PRODUCT.md,DESIGN.md,README.md,AGENTS.md,dev-app-update.yml,.nvmrc,eslint.config.mjs}'
  - '!{installer,scripts,test,patches}/**'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  icon: 'build/icon.ico'
  electronLanguages: ['ko', 'en-US', 'en-GB']
  target: 
    - target: 'nsis'
      arch: 'x64'
  extraResources:
    - from: 'installer/uninstall'
      to: 'uninstall-wizard'
    - from: 'installer/style.css'
      to: 'uninstall-wizard/style.css'
    - from: 'app/assets/images/SealCircle.png'
      to: 'uninstall-wizard/assets/SealCircle.png'
    - from: 'app/assets/fonts'
      to: 'uninstall-wizard/assets'
      filter:
        - 'PretendardVariable.woff2'
        - 'Pretendard-LICENSE.txt'

# Windows Installer Configuration
nsis:
  include: 'build/uninstaller.nsh'
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  icon: 'build/icon.png'
  target: 'AppImage'
  maintainer: 'JooHwan Kim'
  vendor: 'Alice GameLand'
  synopsis: '앨리스의 게임랜드 Minecraft 런처'
  description: 'Minecraft 26.2와 NeoForge 클라이언트를 자동으로 설치하고 업데이트합니다.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'
