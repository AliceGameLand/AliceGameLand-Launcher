name: Windows Release QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: node --test test/*.test.js
      - run: npm run dist:setup
      - uses: actions/upload-artifact@v6
        with:
          name: electron-1.0.42-verified
          path: |
            dist/custom-setup/*.exe
            dist/custom-setup/*.blockmap
            dist/custom-setup/latest.yml
          if-no-files-found: error
      - name: Verify the public updater, all-users setup, and Korean paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-WinSystemLocale | Format-List Name
          (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage' -Name ACP).ACP
          node scripts/qa-electron-release.mjs
