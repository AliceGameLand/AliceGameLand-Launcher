name: Windows Release QA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        scope: [currentuser, java]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Get the exact previously built candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42778273355 -n electron-1.0.42-verified -D dist/custom-setup
      - name: Verify in isolated English Windows
        env:
          GH_TOKEN: ${{ github.token }}
          QA_SCOPE: ${{ matrix.scope }}
        run: |
          Get-WinSystemLocale | Format-List Name
          (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage' -Name ACP).ACP
          node scripts/qa-electron-release.mjs
