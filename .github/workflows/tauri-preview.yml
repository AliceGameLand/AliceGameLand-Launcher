name: Tauri preview

on:
  push:
    branches: [codex/tauri-migration]
  workflow_dispatch:
    inputs:
      benchmark:
        description: Compare launcher performance with Electron v1.0.41
        type: boolean
        default: false
      runtime:
        description: Download and verify the pinned Java runtime on both platforms
        type: boolean
        default: false
      game_files:
        description: Prepare live NeoForge and Fabric game files without starting Minecraft
        type: boolean
        default: false
      oauth:
        description: Open and cancel the real Microsoft sign-in window
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[build-only]')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    env:
      ALICE_TAURI_UPDATE_PUBLIC_KEY: ${{ vars.ALICE_TAURI_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - if: runner.os == 'Windows'
        run: npm run lint
      - if: runner.os == 'macOS'
        run: |
          npm run lint -- --rule '@stylistic/linebreak-style: off'
      - run: npm run tauri:ui
      - run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify first Java 25 download and cache reuse
        if: inputs.runtime || contains(github.event.head_commit.message, '[runtime]')
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml downloads_and_reuses_java_25 -- --ignored
      - name: Verify real Minecraft and loader preparation
        if: inputs.game_files || contains(github.event.head_commit.message, '[game-files]')
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml prepares_real_fabric_and_neoforge_launches -- --ignored --nocapture
      - name: Verify local mod removal uses the system Trash
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml sends_only_the_selected_mod_to_os_trash -- --ignored
      - if: runner.os == 'Windows'
        run: npm run tauri -- build --ci --no-bundle -- --locked
      - name: Verify the Windows login screen
        if: runner.os == 'Windows'
        env:
          VERIFY_OAUTH: ${{ inputs.oauth || contains(github.event.head_commit.message, '[oauth]') }}
        run: |
          $profile = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "alice-startup-$([guid]::NewGuid())")
          $env:ALICE_TAURI_TEST_PROFILE = $profile.FullName
          $verifyOAuth = $env:VERIFY_OAUTH -eq 'true'
          $env:ALICE_TAURI_VERIFY_LOGIN = if ($verifyOAuth) { 'oauth' } else { '1' }
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $profile.FullName 'webview'
          $launcher = Start-Process -FilePath 'src-tauri/target/release/alice-gameland.exe' -WindowStyle Hidden -PassThru
          try {
            $receiptName = if ($verifyOAuth) { 'oauth-cancelled' } else { 'login-ready' }
            $receipt = Join-Path $profile.FullName $receiptName
            for ($attempt = 0; $attempt -lt 100; $attempt++) {
              if (Test-Path -LiteralPath $receipt) { break }
              if ($launcher.HasExited) { throw "Launcher exited with code $($launcher.ExitCode)" }
              Start-Sleep -Milliseconds 500
            }
            if (!(Test-Path -LiteralPath $receipt)) { throw "Launcher did not report $receiptName" }
            Write-Output "Windows launcher reported $receiptName"
          } finally {
            if (!$launcher.HasExited) { Stop-Process -Id $launcher.Id }
          }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: tauri-windows-x64-portable
          path: src-tauri/target/release/*.exe
          if-no-files-found: error
      - if: runner.os == 'Windows'
        run: node scripts/build-tauri-setup.mjs
      - if: runner.os == 'Windows'
        run: |
          $setup = Get-ChildItem -LiteralPath dist/tauri-setup -Filter '*-setup.exe'
          ./scripts/test-tauri-setup.ps1 -Installer $setup.FullName
          node scripts/test-tauri-update.mjs $setup.FullName
      - name: Verify the previous Windows executable is replaced
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fixture = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'launcher executable rename')
          gh release download v1.0.48 -R AliceGameLand/AliceGameLand-Launcher --pattern 'alice-gameland-setup-1.0.48.exe' --dir $fixture.FullName
          if ($LASTEXITCODE) { throw 'Could not fetch the previous launcher' }
          $target = Join-Path $fixture.FullName 'alice-gameland-launcher'
          $old = Start-Process -FilePath (Join-Path $fixture.FullName 'alice-gameland-setup-1.0.48.exe') -ArgumentList "/S /currentuser /D=$target" -Wait -PassThru
          if ($old.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $target 'AliceGameLand-Tauri.exe'))) {
            throw 'Previous launcher did not install'
          }
          $setup = Get-ChildItem -LiteralPath dist/tauri-setup -Filter '*-setup.exe'
          $env:ALICE_TAURI_TEST_PROFILE = $fixture.FullName
          $env:ALICE_TAURI_VERIFY_ELECTRON_TRANSITION = '1'
          $updated = Start-Process -FilePath $setup.FullName -ArgumentList '--updated','--force-run' -PassThru
          if (!$updated.WaitForExit(60000)) { throw 'Upgrade wizard timed out' }
          if ($updated.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $target 'AliceGameLand.exe')) -or
              (Test-Path -LiteralPath (Join-Path $target 'AliceGameLand-Tauri.exe'))) {
            throw 'Upgrade did not replace the previous executable'
          }
          Remove-Item Env:ALICE_TAURI_TEST_PROFILE, Env:ALICE_TAURI_VERIFY_ELECTRON_TRANSITION
          $worker = Join-Path $fixture.FullName 'remove-worker.exe'
          Copy-Item -LiteralPath (Join-Path $target 'Uninstall AliceGameLand.exe') -Destination $worker
          $removed = Start-Process -FilePath $worker -ArgumentList "/S /currentuser _?=$target" -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw 'Upgrade fixture cleanup failed' }
      - name: Verify Electron upgrades to Tauri in the same folder
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fixture = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'electron transition')
          gh release download v1.0.43 -R AliceGameLand/AliceGameLand-Launcher --pattern 'alice-gameland-setup-1.0.43.exe' --dir $fixture.FullName
          if ($LASTEXITCODE) { throw 'Could not fetch Electron reference' }
          $electron = Join-Path $fixture.FullName 'alice-gameland-setup-1.0.43.exe'
          $target = Join-Path $fixture.FullName 'alice-gameland-launcher'
          $original = Start-Process -FilePath $electron -ArgumentList "/S /currentuser /D=$target" -Wait -PassThru
          if ($original.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $target 'Uninstall 앨리스의 게임랜드.exe'))) {
            throw 'Electron reference did not install'
          }
          $data = New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA '.alicegameland/instances')
          $gameFile = Join-Path $data.FullName 'keep.txt'
          Set-Content -LiteralPath $gameFile -Value 'game-fixture'
          $config = New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA '앨리스의 게임랜드')
          $settings = Join-Path $config.FullName 'config.json'
          Set-Content -LiteralPath $settings -Value '{}'
          $setup = Get-ChildItem -LiteralPath dist/tauri-setup -Filter '*-setup.exe'
          $env:ALICE_TAURI_TEST_PROFILE = $fixture.FullName
          $env:ALICE_TAURI_VERIFY_ELECTRON_TRANSITION = '1'
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList '--updated','--force-run' -PassThru
          if (!$installer.WaitForExit(60000) -or $installer.ExitCode -ne 0) { throw 'Electron transition failed' }
          if (!(Test-Path -LiteralPath (Join-Path $target 'AliceGameLand.exe')) -or
              (Test-Path -LiteralPath (Join-Path $target '앨리스의 게임랜드.exe')) -or
              (Test-Path -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\3d6e8bdf-a47b-5327-b17b-ac5678029a9c') -or
              (Get-Content -LiteralPath $gameFile) -ne 'game-fixture' -or
              (Get-Content -LiteralPath $settings) -ne '{}') {
            throw 'Migration did not preserve game and configuration or left Electron registered'
          }
      - name: Compare Windows launcher startup and memory
        if: runner.os == 'Windows' && (inputs.benchmark || contains(github.event.head_commit.message, '[benchmark]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $reference = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "alice-benchmark-$([guid]::NewGuid())")
          gh release download v1.0.41 --repo AliceGameLand/AliceGameLand-Launcher --pattern 'alice-gameland-setup-1.0.41.exe' --dir $reference.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published Electron reference' }
          $setup = Join-Path $reference.FullName 'alice-gameland-setup-1.0.41.exe'
          if ((Get-FileHash -LiteralPath $setup).Hash -ne '276B1011E9455C31D0E5CC360A25C8F10CDD1AAF41DF81A625E3D43D3C35FD3F') {
            throw 'The published Electron reference digest changed'
          }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          $wrapper = Join-Path $reference.FullName 'wrapper'
          & $sevenZip x -t7z $setup 'resources\payload\launcher.exe' "-o$wrapper" -y
          if ($LASTEXITCODE -gt 1) { throw 'Could not extract the Electron setup payload' }
          $payload = Join-Path $wrapper 'resources/payload/launcher.exe'
          $application = Join-Path $reference.FullName 'application'
          & $sevenZip x -t7z $payload "-o$application" -y
          if ($LASTEXITCODE -gt 1) { throw 'Could not extract the Electron application' }
          $electron = Join-Path $application '앨리스의 게임랜드.exe'
          if (!(Test-Path -LiteralPath $electron -PathType Leaf)) { throw 'Missing Electron application' }
          node scripts/benchmark-launcher.mjs $electron src-tauri/target/release/alice-gameland.exe --tauri-receipt |
            Tee-Object -FilePath dist/benchmark-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Launcher benchmark did not finish' }
      - name: Upload the Windows comparison
        if: runner.os == 'Windows' && (inputs.benchmark || contains(github.event.head_commit.message, '[benchmark]'))
        uses: actions/upload-artifact@v6
        with:
          name: windows-launcher-benchmark
          path: dist/benchmark-windows.json
          if-no-files-found: error
      - if: runner.os == 'macOS'
        run: npm run tauri -- build --ci -- --locked
      - if: runner.os == 'macOS'
        shell: bash
        env:
          VERIFY_OAUTH: ${{ inputs.oauth || contains(github.event.head_commit.message, '[oauth]') }}
        run: |
          profile=$(mktemp -d "$RUNNER_TEMP/alice-startup.XXXXXX")
          mount="$profile/mount"
          mkdir "$mount" "$profile/앨리스의 게임랜드"
          dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          pid=
          trap 'if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi; hdiutil detach "$mount"' EXIT
          app=$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          launcher="$app/Contents/MacOS/$executable"
          test "$(lipo -archs "$launcher")" = arm64
          node scripts/test-tauri-update.mjs "$app"
          printf '%s\n' '{"settings":{"game":{"fullscreen":true}},"authenticationDatabase":{"fixture":true}}' > "$profile/앨리스의 게임랜드/config.json"
          login_mode=1
          receipt=login-ready
          if [ "$VERIFY_OAUTH" = true ]; then
            login_mode=oauth
            receipt=oauth-cancelled
          fi
          ALICE_TAURI_TEST_PROFILE="$profile" ALICE_TAURI_VERIFY_LOGIN="$login_mode" "$launcher" > "$profile/startup.log" 2>&1 &
          pid=$!
          for attempt in {1..100}; do
            test -s "$profile/$receipt" && break
            kill -0 "$pid" 2>/dev/null || { cat "$profile/startup.log"; exit 1; }
            sleep 0.5
          done
          test -s "$profile/$receipt" || { cat "$profile/startup.log"; exit 1; }
          sleep 2
          kill -0 "$pid" 2>/dev/null || { cat "$profile/startup.log"; exit 1; }
          node -e 'const assert = require("node:assert/strict"); const data = require(process.argv[1]); assert.equal(data.settings.game.fullscreen, true); assert.equal(data.authenticationDatabase, undefined)' "$profile/preferences.json"
          echo "Packaged launcher reported $receipt on $(uname -m) and imported legacy preferences"
          mkdir -p dist/tauri-macos-update
          tar -czf dist/tauri-macos-update/alice-gameland-arm64.app.tar.gz -C "$mount" "$(basename "$app")"
      - uses: actions/upload-artifact@v6
        with:
          name: tauri-${{ matrix.platform }}
          path: |
            dist/tauri-setup/*-setup.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            dist/tauri-macos-update/*.app.tar.gz
          if-no-files-found: error
      - name: Compare Apple Silicon launcher startup and installer size
        if: runner.os == 'macOS' && (inputs.benchmark || contains(github.event.head_commit.message, '[benchmark-mac]'))
        shell: bash
        run: |
          git fetch --depth=1 origin refs/tags/v1.0.41
          reference_commit=aa0ae5575d2345728bf54090968ba683abe7b7c4
          test "$(git rev-parse FETCH_HEAD)" = "$reference_commit"
          reference=$(mktemp -d "$RUNNER_TEMP/alice-electron.XXXXXX")
          git worktree add --detach "$reference/source" "$reference_commit"
          (
            cd "$reference/source"
            # Restore the original DMG build dependency coordinates without changing its archive hash.
            node <<'NODE'
          const fs = require('node:fs')
          const reference = JSON.parse(fs.readFileSync('package-lock.json'))
          const current = require(process.env.GITHUB_WORKSPACE + '/package-lock.json')
          const builder = 'node_modules/dmg-builder'
          const license = 'node_modules/dmg-license'
          for (const dependency of [builder, license]) {
              if (reference.packages[dependency].integrity !== current.packages[dependency].integrity) {
                  throw new Error(`Electron reference dependency changed: ${dependency}`)
              }
          }
          reference.packages[builder].optionalDependencies = current.packages[builder].optionalDependencies
          reference.packages[license] = current.packages[license]
          fs.writeFileSync('package-lock.json', JSON.stringify(reference, null, 2) + '\n')
          NODE
            npm ci
            # The pinned builder uses NFD helper names but leaves CFBundleName in NFC by default.
            bundle_name=$(node -e 'const fs = require("node:fs"); const yaml = require("js-yaml"); console.log(yaml.load(fs.readFileSync("electron-builder.yml", "utf8")).productName.normalize("NFD"))')
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist -- --mac dmg --arm64 --publish never "-c.mac.extendInfo.CFBundleName=$bundle_name"
          )
          electron_dmg=$(find "$reference/source/dist" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          tauri_dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
          mount="$reference/mount"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          install_app() {
            test -f "$1"
            mkdir -p "$mount"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$1"
            local app
            app=$(find "$mount" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)
            test -d "$app"
            mkdir -p "$2"
            installed_app="$2/$(basename "$app")"
            ditto "$app" "$installed_app"
            hdiutil detach "$mount"
          }
          install_app "$electron_dmg" "$reference/installed-electron"
          electron_app="$installed_app"
          install_app "$tauri_dmg" "$reference/installed-tauri"
          tauri_app="$installed_app"
          executable() {
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$1/Contents/Info.plist"
          }
          electron="$electron_app/Contents/MacOS/$(executable "$electron_app")"
          tauri="$tauri_app/Contents/MacOS/$(executable "$tauri_app")"
          bundle_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$electron_app/Contents/Info.plist")
          test -x "$electron_app/Contents/Frameworks/$bundle_name Helper.app/Contents/MacOS/$bundle_name Helper"
          test "$(lipo -archs "$electron")" = arm64
          test "$(lipo -archs "$tauri")" = arm64
          codesign --verify --deep --strict "$electron_app" || echo '::warning::Electron reference signature verification failed'
          node scripts/benchmark-launcher.mjs "$electron" "$tauri" > "$reference/startup.json"
          node -e 'const fs = require("node:fs"); const [startup, electron, tauri] = process.argv.slice(1); const result = JSON.parse(fs.readFileSync(startup)); result.installerBytes = { electron: fs.statSync(electron).size, tauri: fs.statSync(tauri).size }; console.log(JSON.stringify(result, null, 2))' "$reference/startup.json" "$electron_dmg" "$tauri_dmg" > dist/benchmark-macos.json
      - name: Upload the Apple Silicon comparison
        if: runner.os == 'macOS' && (inputs.benchmark || contains(github.event.head_commit.message, '[benchmark-mac]'))
        uses: actions/upload-artifact@v6
        with:
          name: macos-launcher-benchmark
          path: dist/benchmark-macos.json
          if-no-files-found: error
