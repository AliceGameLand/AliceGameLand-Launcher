name: Tauri preview

on:
  push:
    branches: [codex/tauri-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - if: runner.os == 'Windows'
        run: npm run lint
      - if: runner.os == 'macOS'
        run: |
          npm run lint -- --rule '@stylistic/linebreak-style: off'
      - run: npm run tauri:ui
      - run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify local mod removal uses the system Trash
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml sends_only_the_selected_mod_to_os_trash -- --ignored
      - if: runner.os == 'Windows'
        run: npm run tauri -- build --ci --no-bundle -- --locked
      - name: Verify the Windows login screen
        if: runner.os == 'Windows'
        run: |
          $profile = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "alice-startup-$([guid]::NewGuid())")
          $env:ALICE_TAURI_TEST_PROFILE = $profile.FullName
          $env:ALICE_TAURI_VERIFY_LOGIN = '1'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $profile.FullName 'webview'
          $launcher = Start-Process -FilePath 'src-tauri/target/release/alice-gameland.exe' -WindowStyle Hidden -PassThru
          try {
            $receipt = Join-Path $profile.FullName 'login-ready'
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if (Test-Path -LiteralPath $receipt) { break }
              if ($launcher.HasExited) { throw "Launcher exited with code $($launcher.ExitCode)" }
              Start-Sleep -Milliseconds 500
            }
            if (!(Test-Path -LiteralPath $receipt)) { throw 'Launcher did not render the login screen' }
            Write-Output 'Windows login screen rendered'
          } finally {
            if (!$launcher.HasExited) { Stop-Process -Id $launcher.Id }
          }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: tauri-windows-x64-portable
          path: src-tauri/target/release/*.exe
          if-no-files-found: error
      - if: runner.os == 'Windows'
        run: node scripts/build-tauri-setup.mjs
      - if: runner.os == 'Windows'
        run: |
          $setup = Get-ChildItem -LiteralPath dist/tauri-setup -Filter '*-setup.exe'
          ./scripts/test-tauri-setup.ps1 -Installer $setup.FullName
          node scripts/test-tauri-update.mjs $setup.FullName
      - if: runner.os == 'macOS'
        run: npm run tauri -- build --ci -- --locked
      - name: Verify the signed macOS package replaces an installed app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          node scripts/test-tauri-update.mjs "$app"
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          profile=$(mktemp -d "$RUNNER_TEMP/alice-startup.XXXXXX")
          mount="$profile/mount"
          mkdir "$mount" "$profile/앨리스의 게임랜드"
          dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          pid=
          trap 'if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi; hdiutil detach "$mount"' EXIT
          app=$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          launcher="$app/Contents/MacOS/$executable"
          test "$(lipo -archs "$launcher")" = arm64
          printf '%s\n' '{"settings":{"game":{"fullscreen":true}},"authenticationDatabase":{"fixture":true}}' > "$profile/앨리스의 게임랜드/config.json"
          ALICE_TAURI_TEST_PROFILE="$profile" ALICE_TAURI_VERIFY_LOGIN=1 "$launcher" > "$profile/startup.log" 2>&1 &
          pid=$!
          for attempt in {1..40}; do
            test -s "$profile/login-ready" && break
            kill -0 "$pid" 2>/dev/null || { cat "$profile/startup.log"; exit 1; }
            sleep 0.5
          done
          test -s "$profile/login-ready" || { cat "$profile/startup.log"; exit 1; }
          sleep 2
          kill -0 "$pid" 2>/dev/null || { cat "$profile/startup.log"; exit 1; }
          node -e 'const assert = require("node:assert/strict"); const data = require(process.argv[1]); assert.equal(data.settings.game.fullscreen, true); assert.equal(data.authenticationDatabase, undefined)' "$profile/preferences.json"
          echo "Packaged launcher rendered the login screen on $(uname -m) and imported legacy preferences"
      - uses: actions/upload-artifact@v6
        with:
          name: tauri-${{ matrix.platform }}
          path: |
            dist/tauri-setup/*-setup.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
