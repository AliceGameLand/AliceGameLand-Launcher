[package]
name = "alice-gameland"
version = "1.0.41"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
md-5 = "0.10"
tauri = "2"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
getrandom = "0.3"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
tokio = { version = "1", features = ["io-util", "net", "sync", "time"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
hickory-resolver = "0.26"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
